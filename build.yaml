# This file generates the GitHub Actions matrix
---
include:
  # --- Keyboard #1: with nice!view displays ---
  - board: nice_nano_v2
    shield: mriya_left_main_display nice_view_adapter nice_view_gem
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano_v2
    shield: mriya_right_secondary_display nice_view_adapter nice_view_gem

  # --- Keyboard #2: no displays ---
  - board: nice_nano_v2
    shield: mriya_left_main
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano_v2
    shield: mriya_right_secondary

  - board: nice_nano_v2
    shield: settings_reset
